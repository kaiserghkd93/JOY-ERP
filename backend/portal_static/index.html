<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조이산업 협력사 포털</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; min-height: 100vh; }

  /* 로그인 */
  #login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 360px; }
  .login-box h1 { text-align: center; color: #1a1a2e; font-size: 22px; margin-bottom: 8px; }
  .login-box p { text-align: center; color: #666; font-size: 13px; margin-bottom: 28px; }
  .logo { text-align: center; font-size: 36px; margin-bottom: 16px; }

  /* 메인 */
  #main-page { display: none; }
  header { background: #1a1a2e; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; }
  header span { font-size: 13px; opacity: 0.8; }
  .logout-btn { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }

  .tabs { background: white; border-bottom: 1px solid #e0e0e0; padding: 0 24px; display: flex; gap: 0; }
  .tab { padding: 14px 20px; cursor: pointer; font-size: 14px; color: #666; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tab.active { color: #1a1a2e; border-bottom-color: #1a1a2e; font-weight: 600; }

  .content { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  /* 폼 공통 */
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
  input[type=text], input[type=password], input[type=number], input[type=date], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit;
    transition: border 0.2s;
  }
  input:focus, textarea:focus { outline: none; border-color: #1a1a2e; }
  .form-group { margin-bottom: 18px; }

  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: #1a1a2e; color: white; width: 100%; padding: 12px; font-size: 15px; }
  .btn-primary:hover { background: #2d2d4e; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-blue { background: #3b82f6; color: white; }
  .btn-blue:hover { background: #2563eb; }
  .btn-green { background: #10b981; color: white; }
  .btn-green:hover { background: #059669; }

  .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .alert-error { background: #fee2e2; color: #dc2626; }
  .alert-success { background: #d1fae5; color: #059669; }

  /* 테이블 */
  .card { background: white; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; font-weight: 600; font-size: 15px; color: #1a1a2e; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f8f9fa; padding: 11px 14px; text-align: left; font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }
  .badge-yellow { background: #fef3c7; color: #d97706; }
  .badge-green { background: #d1fae5; color: #059669; }

  /* 납품 입력 */
  .deliver-form { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .po-select-list { max-height: 300px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 16px; }
  .po-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.15s; }
  .po-item:last-child { border-bottom: none; }
  .po-item:hover { background: #f8f9fa; }
  .po-item.selected { background: #eff6ff; border-left: 3px solid #3b82f6; }
  .po-item-name { font-weight: 600; font-size: 14px; }
  .po-item-info { font-size: 12px; color: #888; margin-top: 3px; }

  .deliver-lines { margin-top: 16px; }
  .deliver-line { display: grid; grid-template-columns: 1fr 120px 140px auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .deliver-line:last-child { border-bottom: none; }

  .loading { text-align: center; padding: 40px; color: #888; }
  .empty { text-align: center; padding: 40px; color: #aaa; }

  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .summary-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .summary-card .label { font-size: 12px; color: #888; margin-bottom: 8px; }
  .summary-card .value { font-size: 24px; font-weight: 700; color: #1a1a2e; }
  .summary-card .sub { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>

<!-- 로그인 페이지 -->
<div id="login-page">
  <div class="login-box">
    <div class="logo">🏭</div>
    <h1>조이산업 협력사 포털</h1>
    <p>발주 확인 및 납품 관리 시스템</p>
    <div id="login-error" class="alert alert-error" style="display:none"></div>
    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="username" placeholder="아이디 입력" />
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')login()" />
    </div>
    <button class="btn btn-primary" onclick="login()">로그인</button>
  </div>
</div>

<!-- 메인 페이지 -->
<div id="main-page">
  <header>
    <h1>🏭 조이산업 협력사 포털</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="user-name"></span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="showTab('orders')">📋 발주 현황</div>
    <div class="tab" onclick="showTab('deliver')">📦 납품 입력</div>
    <div class="tab" onclick="showTab('history')">📜 납품 이력</div>
  </div>

  <div class="content">
    <!-- 발주 현황 -->
    <div id="tab-orders" class="section active">
      <div id="summary-grid" class="summary-grid"></div>
      <div class="card">
        <div class="card-header">미납 발주 목록</div>
        <div id="orders-body"><div class="loading">로딩 중...</div></div>
      </div>
    </div>

    <!-- 납품 입력 -->
    <div id="tab-deliver" class="section">
      <div class="deliver-form">
        <h3 style="margin-bottom:20px;color:#1a1a2e">납품 입력</h3>
        <div id="deliver-alert"></div>

        <div class="form-group">
          <label>납품일</label>
          <input type="date" id="deliver-date" />
        </div>

        <div class="form-group">
          <label>발주 선택 (복수 선택 가능)</label>
          <div id="po-select-list" class="po-select-list"><div class="loading">로딩 중...</div></div>
        </div>

        <div id="deliver-lines" class="deliver-lines" style="display:none">
          <label style="margin-bottom:12px">납품 수량 입력</label>
          <div id="lines-container"></div>
        </div>

        <div class="form-group" style="margin-top:16px">
          <label>비고</label>
          <input type="text" id="deliver-note" placeholder="비고 (선택)" />
        </div>

        <button class="btn btn-green" style="width:100%;padding:13px;font-size:15px" onclick="submitDeliver()">납품 제출</button>
      </div>
    </div>

    <!-- 납품 이력 -->
    <div id="tab-history" class="section">
      <div class="card">
        <div class="card-header">납품 이력 (최근 200건)</div>
        <div id="history-body"><div class="loading">로딩 중...</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';  // 같은 도메인
let token = localStorage.getItem('portal_token');
let orders = [];
let selectedPOs = {};

// 오늘 날짜 기본값
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('deliver-date').value = today;
  if (token) initMain();
});

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (r.status === 401) { logout(); return null; }
  return r.json();
}

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return;

  const data = await api('POST', '/auth/login', { username, password });
  if (!data || data.detail) {
    document.getElementById('login-error').textContent = '아이디 또는 비밀번호가 틀립니다.';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  token = data.access_token;
  localStorage.setItem('portal_token', token);
  initMain();
}

function logout() {
  token = null;
  localStorage.removeItem('portal_token');
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
}

async function initMain() {
  const me = await api('GET', '/auth/me');
  if (!me) return;
  document.getElementById('user-name').textContent = me.name + ' (' + me.username + ')';
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
  loadOrders();
  loadHistory();
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['orders','deliver','history'][i] === tab);
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

async function loadOrders() {
  orders = await api('GET', '/portal/orders') || [];

  // 요약
  const total = orders.reduce((s, o) => s + o.remaining_qty, 0);
  const amt = orders.reduce((s, o) => s + o.remaining_qty * o.unit_price, 0);
  document.getElementById('summary-grid').innerHTML = `
    <div class="summary-card"><div class="label">미납 발주 건수</div><div class="value">${orders.length}건</div></div>
    <div class="summary-card"><div class="label">미납 총 수량</div><div class="value">${total.toLocaleString()}</div><div class="sub">EA</div></div>
    <div class="summary-card"><div class="label">미납 금액</div><div class="value">${Math.round(amt/10000).toLocaleString()}만원</div></div>
  `;

  if (orders.length === 0) {
    document.getElementById('orders-body').innerHTML = '<div class="empty">미납 발주가 없습니다</div>';
    document.getElementById('po-select-list').innerHTML = '<div class="empty">발주 없음</div>';
    return;
  }

  document.getElementById('orders-body').innerHTML = `
    <table>
      <thead><tr>
        <th>발주번호</th><th>품목</th><th>발주수량</th><th>납품완료</th><th>잔여수량</th><th>납기일</th><th>상태</th>
      </tr></thead>
      <tbody>${orders.map(o => `
        <tr>
          <td>${o.po_no}</td>
          <td><strong>${o.item_name}</strong><br><small style="color:#888">${o.part_no}</small></td>
          <td>${o.qty.toLocaleString()} ${o.item_unit}</td>
          <td>${o.delivered_qty.toLocaleString()} ${o.item_unit}</td>
          <td><strong style="color:#dc2626">${o.remaining_qty.toLocaleString()} ${o.item_unit}</strong></td>
          <td>${o.due_date}</td>
          <td><span class="badge ${o.status==='partial'?'badge-yellow':'badge-blue'}">${o.status==='open'?'미납':'부분납품'}</span></td>
        </tr>
      `).join('')}</tbody>
    </table>
  `;

  // 납품 선택 목록
  document.getElementById('po-select-list').innerHTML = orders.map(o => `
    <div class="po-item" id="po-${o.po_no}" onclick="togglePO('${o.po_no}')">
      <div class="po-item-name">${o.item_name} (${o.po_no})</div>
      <div class="po-item-info">잔여: ${o.remaining_qty.toLocaleString()} ${o.item_unit} | 납기: ${o.due_date}</div>
    </div>
  `).join('');
}

function togglePO(poNo) {
  const el = document.getElementById('po-' + poNo);
  if (selectedPOs[poNo]) {
    delete selectedPOs[poNo];
    el.classList.remove('selected');
  } else {
    const o = orders.find(x => x.po_no === poNo);
    selectedPOs[poNo] = { po_no: poNo, qty: o.remaining_qty, unit_price: o.unit_price, item_name: o.item_name, item_unit: o.item_unit };
    el.classList.add('selected');
  }
  renderLines();
}

function renderLines() {
  const keys = Object.keys(selectedPOs);
  if (keys.length === 0) {
    document.getElementById('deliver-lines').style.display = 'none';
    return;
  }
  document.getElementById('deliver-lines').style.display = 'block';
  document.getElementById('lines-container').innerHTML = keys.map(k => {
    const p = selectedPOs[k];
    return `
      <div class="deliver-line">
        <div><strong>${p.item_name}</strong><br><small style="color:#888">${p.po_no}</small></div>
        <input type="number" value="${p.qty}" min="1" style="width:100%"
          onchange="selectedPOs['${k}'].qty=parseInt(this.value)||0" />
        <input type="number" value="${p.unit_price}" min="0" step="0.01" style="width:100%"
          onchange="selectedPOs['${k}'].unit_price=parseFloat(this.value)||0" placeholder="단가" />
        <button class="btn btn-sm" style="background:#fee2e2;color:#dc2626" onclick="togglePO('${k}')">✕</button>
      </div>
    `;
  }).join('');
}

async function submitDeliver() {
  const lines = Object.values(selectedPOs);
  if (lines.length === 0) { alert('납품할 발주를 선택하세요'); return; }
  const date = document.getElementById('deliver-date').value;
  if (!date) { alert('납품일을 선택하세요'); return; }

  const alertEl = document.getElementById('deliver-alert');

  const body = {
    delivery_date: date,
    note: document.getElementById('deliver-note').value,
    lines: lines.map(l => ({ po_no: l.po_no, qty: l.qty, unit_price: l.unit_price }))
  };

  const r = await api('POST', '/portal/deliver', body);
  if (!r) return;
  if (r.ok) {
    alertEl.className = 'alert alert-success';
    alertEl.textContent = `납품 완료! 입고번호: ${r.receipts.map(x=>x.gr_no).join(', ')}`;
    selectedPOs = {};
    loadOrders();
    loadHistory();
  } else {
    alertEl.className = 'alert alert-error';
    alertEl.textContent = r.detail || '오류가 발생했습니다';
  }
}

async function loadHistory() {
  const history = await api('GET', '/portal/history') || [];
  if (history.length === 0) {
    document.getElementById('history-body').innerHTML = '<div class="empty">납품 이력이 없습니다</div>';
    return;
  }
  document.getElementById('history-body').innerHTML = `
    <table>
      <thead><tr>
        <th>입고번호</th><th>발주번호</th><th>품목</th><th>수량</th><th>단가</th><th>금액</th><th>납품일</th><th>상태</th>
      </tr></thead>
      <tbody>${history.map(h => `
        <tr>
          <td>${h.gr_no}</td>
          <td>${h.po_no || '-'}</td>
          <td>${h.item_name}</td>
          <td>${h.qty.toLocaleString()}</td>
          <td>${Math.round(h.unit_price).toLocaleString()}원</td>
          <td>${Math.round(h.amount).toLocaleString()}원</td>
          <td>${h.receipt_date}</td>
          <td><span class="badge badge-green">확정</span></td>
        </tr>
      `).join('')}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
